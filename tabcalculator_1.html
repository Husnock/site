// ---- risk model -------------------------------------------------------
function computeRisk(project, budgetTotal, actualTotal, progressPct) {
  if (project.status === "Voorbereiding") return {
    key: "voorbereiding",
    label: "NOG NIET GESTART"
  };
  if (project.status === "On hold") return {
    key: "onhold",
    label: "GEPAUZEERD"
  };
  const isDone = project.status === "Afgerond";
  const forecast = isDone ? actualTotal : progressPct > 3 ? actualTotal / (progressPct / 100) : actualTotal > 0 ? actualTotal * 6 : budgetTotal;
  const deviationPct = budgetTotal > 0 ? (forecast - budgetTotal) / budgetTotal * 100 : 0;
  let key = "groen",
    label = "OP SCHEMA";
  if (deviationPct > 15) {
    key = "rood";
    label = isDone ? "OVERSCHREDEN" : "ACTIE VEREIST";
  } else if (deviationPct > 5) {
    key = "oranje";
    label = isDone ? "LICHT OVERSCHREDEN" : "AANDACHT";
  } else if (isDone) {
    label = "BINNEN BUDGET";
  }
  return {
    key,
    label,
    deviationPct,
    forecast
  };
}

// ---- trend extrapolation (recent burn-rate, not just %-complete) ------
function computeTrendForecast(p, actuals, progressRows, budgetTotal, actualTotal) {
  if (p.status !== "Lopend" || progressRows.length < 3) return null;
  const weekStarts = [...new Set(actuals.map(a => a.week_start))].sort();
  const weeklyTotals = weekStarts.map(ws => actuals.filter(a => a.week_start === ws).reduce((s, a) => s + Number(a.werkelijke_kosten), 0));
  if (weeklyTotals.length < 3) return null;
  const totalWeeks = Math.max(weeklyTotals.length, Math.round((new Date(p.verwachte_einddatum) - new Date(p.startdatum)) / (7 * 24 * 3600 * 1000)));
  const weeksRemaining = Math.max(totalWeeks - weeklyTotals.length, 1);
  const recentN = Math.min(4, weeklyTotals.length);
  const recentAvg = weeklyTotals.slice(-recentN).reduce((s, v) => s + v, 0) / recentN;
  const priorSlice = weeklyTotals.slice(0, -recentN);
  const priorAvg = priorSlice.length ? priorSlice.reduce((s, v) => s + v, 0) / priorSlice.length : weeklyTotals.reduce((s, v) => s + v, 0) / weeklyTotals.length;
  const trendForecast = actualTotal + recentAvg * weeksRemaining;
  const trendDeviationPct = budgetTotal > 0 ? (trendForecast - budgetTotal) / budgetTotal * 100 : 0;
  const accelerationPct = priorAvg > 0 ? (recentAvg - priorAvg) / priorAvg * 100 : 0;
  const impactEUR = trendForecast - budgetTotal;

    recentN,
    recentAvg,
    priorAvg,
    accelerationPct,
    trendForecast,
    trendDeviationPct,
    impactEUR,
    weeksRemaining

}
